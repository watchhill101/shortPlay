<!DOCTYPE html>
<html>
<head>
    <title>视频播放测试</title>
</head>
<body>
    <h1>视频播放测试</h1>
    
    <h2>测试1: 直接访问视频文件</h2>
    <video controls width="400">
        <source src="http://localhost:3000/uploads/video/11.mp4" type="video/mp4">
        您的浏览器不支持视频播放
    </video>
    
    <h2>测试2: 通过代理访问视频文件</h2>
    <video controls width="400">
        <source src="http://localhost:3000/video-proxy/11.mp4" type="video/mp4">
        您的浏览器不支持视频播放
    </video>
    
    <h2>测试3: 另一个视频文件</h2>
    <video controls width="400">
        <source src="http://localhost:3000/video-proxy/12.mp4" type="video/mp4">
        您的浏览器不支持视频播放
    </video>
    
    <script>
        document.querySelectorAll('video').forEach((video, index) => {
            video.addEventListener('loadstart', () => {
                console.log(`视频${index + 1}开始加载:`, video.src);
            });
            
            video.addEventListener('canplay', () => {
                console.log(`视频${index + 1}可以播放`);
            });
            
            video.addEventListener('error', (e) => {
                console.error(`视频${index + 1}加载失败:`, e);
                console.error('错误详情:', e.target.error);
            });
        });
    </script>
</body>
</html>
